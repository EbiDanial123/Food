<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Food App</title>

    <style>
        /* 🌞 LIGHT THEME */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-bg: #ffffff;
            --nav-bg: #f8f9fa;
        }

        /* 🌙 DARK THEME */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #ffffff;
            --card-bg: #1e293b;
            --nav-bg: #020617;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            scroll-behavior: smooth;
        }

        /* Force ALL text white in dark mode */
        [data-theme="dark"] * {
            color: #ffffff !important;
        }

        /* Navbar */
        .navbar {
            background-color: var(--nav-bg) !important;
        }

        /* Cards */
        .card, .jumbotron {
            background-color: var(--card-bg) !important;
            border-radius: 12px;
        }

        /* Links */
        [data-theme="dark"] a {
            color: #93c5fd !important;
        }

        /* Forms */
        [data-theme="dark"] input,
        [data-theme="dark"] textarea,
        [data-theme="dark"] select {
            background-color: #020617 !important;
            color: #ffffff !important;
            border: 1px solid #334155;
        }

        [data-theme="dark"] ::placeholder {
            color: #cbd5f5 !important;
        }

        /* Toggle switch */
        .theme-switch {
            cursor: pointer;
            font-size: 1.4rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container d-flex justify-content-between align-items-center">

        <ul class="nav">
            {% if user.is_authenticated %}
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'Allfoods' %}">All Foods</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'cart' %}">Cart</a></li>
            {% else %}
                <li class="nav-item"><a class="nav-link" href="{% url 'registration' %}">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            {% endif %}
        </ul>

        <!-- 🌙 THEME TOGGLE -->
        <div class="theme-switch" onclick="toggleTheme()">
            <i id="themeIcon" class="bi bi-moon-fill"></i>
        </div>

    </div>
</nav>

{% block content %}
{% endblock %}

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const icon = document.getElementById("themeIcon");

        if (html.getAttribute("data-theme") === "dark") {
            html.setAttribute("data-theme", "light");
            icon.className = "bi bi-moon-fill";
            localStorage.setItem("theme", "light");
        } else {
            html.setAttribute("data-theme", "dark");
            icon.className = "bi bi-sun-fill";
            localStorage.setItem("theme", "dark");
        }
    }

    // Persist theme on reload
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
        document.getElementById("themeIcon").className =
            savedTheme === "dark" ? "bi bi-sun-fill" : "bi bi-moon-fill";
    }
</script>

</body>
</html>
