{% extends 'base.html' %}

{% block content %}
<style>
/* Form container */
form {
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    background-color: #f9f9f9;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Labels */
form label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
}

/* Inputs / selects / textareas */
form input[type="text"],
form input[type="hidden"],
form select,
form textarea {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

form input[type="text"]:focus,
form select:focus,
form textarea:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 5px rgba(108, 99, 255, 0.3);
    outline: none;
}

/* Button */
form button {
    background-color: #6c63ff;
    color: #fff;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
}

form button:hover {
    background-color: #574fd6;
    transform: translateY(-2px);
}

/* Form groups spacing */
.form-group {
    margin-bottom: 18px;
}
</style>


<form method="post">
    {% csrf_token %}

    <input type="hidden" name="food_id" value="{{ food.id }}">

    <div class="form-group">
        <label>Size</label>
        {{ form.size }}
    </div>

    <div class="form-group">
        <label>Base</label>
        {{ form.base }}
    </div>

    <div class="form-group">
        <label>Sauce</label>
        {{ form.sauce }}
    </div>

    <div class="form-group">
        <label>Toppings</label>
        {{ form.topping }}
    </div>

    <button type="submit" class="btn btn-secondary mt-3">
        Add to Cart
    </button>
</form>


{% endblock %}
