{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header text-center">
            <h4>Customize food</h4>
        </div>

        <div class="card-body">
            <h5 class="text-center">{{ food.name }}</h5>

            {% if food.foodpic %}
            <div class="text-center mb-3">
                <img src="{{ food.foodpic.url }}"
                     class="img-fluid rounded"
                     style="max-height: 200px;">
            </div>
            {% endif %}

            <form method="post" action="{% url 'add_cart'%}">
                {% csrf_token %}

                <div class="form-group">
                    <label>Food Type</label>
                    {{ form.food_type }}
                </div>

                <div class="form-group">
                    <label>Size</label>
                    {{ form.size }}
                </div>

                <div class="form-group">
                    <label>Base</label>
                    {{ form.base }}
                </div>

                <div class="form-group">
                    <label>Sauce</label>
                    {{ form.sauce }}
                </div>

                <div class="form-group">
                    <label>Toppings</label>
                    {{ form.topping }}
                </div>

                <button type="submit" class="btn btn-secondary mt-3">
                    Add to Cart
                </button>
            </form>

            <a href="{% url 'Allfoods' %}" class="btn btn-primary mt-3">
                Back to Foods
            </a>
        </div>
    </div>
</div>
{% endblock %}
