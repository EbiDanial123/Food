{% extends 'base.html' %}

{% block content %}
<!-- Include Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
/* Container */
.container {
    max-width: 650px;
    margin: 50px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Card styling */
.card {
    background-color: var(--bs-body-bg);
    color: var(--bs-body-color);
    border-radius: 15px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    padding: 40px 30px;
}

/* Heading */
.card h3 {
    font-weight: 700;
    margin-bottom: 25px;
    font-size: 1.7rem;
}

/* Order info */
.order-info p {
    margin-bottom: 8px;
    font-size: 16px;
}
.order-info strong {
    font-weight: 600;
}

/* Payment option card */
.payment-option {
    display: flex;
    align-items: center;
    background-color: var(--bs-gray-100);
    padding: 18px 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
}
.payment-option:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}
.payment-option.selected {
    border-color: #6c63ff;
    box-shadow: 0 6px 20px rgba(108, 99, 255, 0.25);
}

/* Icons */
.payment-option i {
    font-size: 1.8rem;
    margin-right: 15px;
}

/* Labels */
.payment-option label {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    cursor: pointer;
}

/* Hide native radio button */
.payment-option input[type="radio"] {
    display: none;
}

/* Confirm button */
.btn-confirm {
    width: 100%;
    font-size: 17px;
    padding: 14px;
    border-radius: 12px;
    background-color: #6c63ff;
    color: white;
    font-weight: 600;
    transition: background-color 0.3s, transform 0.2s;
    border: none;
}
.btn-confirm:hover {
    background-color: #574fd6;
    transform: translateY(-2px);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
    .payment-option {
        background-color: #2c2c2c;
    }
    .card {
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
}
</style>

<div class="container">
    <div class="card">
        <h3>Select Payment Method 💳</h3>

        <div class="order-info">
            <p><strong>Order ID:</strong> {{ order.order_id }}</p>
            <p><strong>Total Amount:</strong> ₹ {{ order.total_price }}</p>
        </div>

        <form method="post" id="paymentForm">
            {% csrf_token %}

            <!-- Cash on Delivery -->
            <div class="payment-option" onclick="selectPayment('cod')">
                <input type="radio" name="payment_method" value="COD" id="cod">
                <i class="bi bi-cash-stack"></i>
                <label for="cod">Cash on Delivery</label>
            </div>

            <!-- Net Banking -->
            <div class="payment-option" onclick="selectPayment('net')">
                <input type="radio" name="payment_method" value="NET" id="net">
                <i class="bi bi-bank"></i>
                <label for="net">Net Banking</label>
            </div>

            <!-- Online Payment / Cards -->
            <div class="payment-option" onclick="selectPayment('card')">
                <input type="radio" name="payment_method" value="ONLINE" id="card">
                <i class="bi bi-credit-card"></i>
                <label for="card">Credit / Debit / UPI</label>
            </div>

            <!-- Wallets -->
            <div class="payment-option" onclick="selectPayment('wallet')">
                <input type="radio" name="payment_method" value="WALLET" id="wallet">
                <i class="bi bi-wallet2"></i>
                <label for="wallet">Wallets (Paytm, PhonePe, Amazon Pay)</label>
            </div>

            <!-- Buy Now Pay Later -->
            <div class="payment-option" onclick="selectPayment('bnpl')">
                <input type="radio" name="payment_method" value="BNPL" id="bnpl">
                <i class="bi bi-calendar2-week"></i>
                <label for="bnpl">Buy Now Pay Later (Simpl / LazyPay)</label>
            </div>

            <!-- Gift Cards -->
            <div class="payment-option" onclick="selectPayment('gift')">
                <input type="radio" name="payment_method" value="GIFT" id="gift">
                <i class="bi bi-gift"></i>
                <label for="gift">Gift Card / Store Credit</label>
            </div>

            <button type="submit" class="btn-confirm mt-3">Confirm Payment</button>
        </form>
    </div>
</div>

<script>
// JS to handle selection highlight
function selectPayment(id) {
    const options = document.querySelectorAll('.payment-option');
    options.forEach(opt => opt.classList.remove('selected'));
    const selected = document.getElementById(id).parentNode;
    selected.classList.add('selected');
    document.getElementById(id).checked = true;
}
</script>
{% endblock %}
