{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    body {
        background: url("{% static 'images/addfood.jpg' %}") no-repeat center center fixed;
        background-size: cover;
        font-family: 'Segoe UI', sans-serif;
    }
    .add-food-card {
        max-width: 600px;
        margin: 50px auto;
        padding: 30px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        background-color: #4848487d;
    }

    .add-food-card h2 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 700;
        color: #ffffff;
    }

    .form-label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #ffffff;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 20px;
        border: 1px solid #d5d5d5;
        border-radius: 8px;
        font-size: 1rem;
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        font-size: 1.1rem;
        border-radius: 8px;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #fff;
        background-color: #007bff;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.2s ease;
    }

    .back-link:hover {
        background-color: #0056b3;
    }
</style>

<div class="container">

    <!-- BACK TO ALL FOODS -->
    <a href="{% url 'Allfoods' %}" class="back-link">← Back to All Foods</a>

    <div class="add-food-card">
        <h2>Add Food Item</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label class="form-label">Food Name</label>
            {{ form.name }}

            <label class="form-label">Price</label>
            {{ form.price }}

            <label class="form-label">Rating</label>
            {{ form.rating }}

            <label class="form-label">Category</label>
            {{ form.Categories }}

            <label class="form-label">Food Image</label>
            {{ form.foodpic }}

            <input type="submit" class="btn btn-success" value="Add Food">
        </form>

    </div>

</div>

{% endblock %}
